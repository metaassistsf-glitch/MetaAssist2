
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Metaassist</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/index.css">
</head>
<body class="bg-slate-50 text-slate-900">
    <div id="root"></div>
    <div id="error-log" style="position: fixed; top: 0; left: 0; background: red; color: white; z-index: 9999; padding: 10px; display: none;"></div>
    <script>
      window.onerror = function(msg, url, line, col, error) {
        if (msg && (msg.toString().includes('WebSocket') || msg.toString().includes('vite'))) return;
        var el = document.getElementById('error-log');
        el.style.display = 'block';
        el.innerHTML += '<p>' + msg + ' at ' + line + ':' + col + '</p>';
      };
      window.onunhandledrejection = function(event) {
        const reason = event.reason ? event.reason.toString() : '';
        if (reason.includes('WebSocket') || reason.includes('vite')) return;
        var el = document.getElementById('error-log');
        el.style.display = 'block';
        el.innerHTML += '<p>Unhandled Rejection: ' + reason + '</p>';
      };
    </script>
<script type="module" src="/index.tsx"></script>
</body>
</html>
